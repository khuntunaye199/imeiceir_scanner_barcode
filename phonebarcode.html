<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QRCode.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
        <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">QR Code Generator</h1>
        
        <div class="space-y-4">
            <input 
                type="text" 
                id="textInput" 
                placeholder="စာသား သို့မဟုတ် Link ထည့်ပါ..." 
                class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition"
            >
            <button 
                onclick="generateQR()" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition duration-200"
            >
                QR Code ထုတ်လုပ်မည်
            </button>
        </div>

        <div id="qrContainer" class="mt-8 flex justify-center hidden">
            <div id="qrcode" class="p-2 bg-white rounded-lg border"></div>
        </div>
        
        <p id="helperText" class="text-center text-gray-500 mt-6 text-sm">
            စာသားထည့်ပြီး ခလုတ်ကို နှိပ်လိုက်ပါ။
        </p>
    </div>

    <script>
        // QR Code Generator function
        function generateQR() {
            const input = document.getElementById('textInput').value;
            const qrContainer = document.getElementById('qrContainer');
            const qrElement = document.getElementById('qrcode');
            const helperText = document.getElementById('helperText');

            if (input.trim() === "") {
                alert("ကျေးဇူးပြု၍ စာသားအနည်းငယ်ထည့်ပေးပါ။");
                return;
            }

            // Clear previous QR code
            qrElement.innerHTML = "";
            
            // Create new QR Code
            new QRCode(qrElement, {
                text: input,
                width: 256,
                height: 256,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });

            // Show container and hide helper text
            qrContainer.classList.remove('hidden');
            helperText.classList.add('hidden');
        }
    </script>
</body>
</html>
